// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {

    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Shared reusable components — exported to window for the other Babel files.
const { useRef, useEffect, useState, useMemo } = React;
const { motion, useScroll, useTransform } = window.FramerMotion || window.Motion || {};

/* ----------------------------- FadeIn ----------------------------- */
function FadeIn({
  as = 'div',
  children,
  delay = 0,
  duration = 0.7,
  x = 0,
  y = 30,
  className = '',
  style = {},
  ...rest
}) {
  const Comp = motion[as] || motion.div;
  return (
    <Comp
      initial={{ opacity: 0, x, y }}
      animate={{ opacity: 1, x: 0, y: 0 }}
      transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
      className={className}
      style={style}
      {...rest}
    >
      {children}
    </Comp>
  );
}

/* ----------------------------- Magnet ----------------------------- */
function Magnet({
  children,
  padding = 100,
  strength = 2,
  activeTransition = 'transform 0.3s ease-out',
  inactiveTransition = 'transform 0.6s ease-in-out',
  className = '',
  style = {},
}) {
  const wrapperRef = useRef(null);
  const innerRef = useRef(null);
  const [active, setActive] = useState(false);

  useEffect(() => {
    const onMove = (e) => {
      const wrap = wrapperRef.current;
      const inner = innerRef.current;
      if (!wrap || !inner) return;
      const rect = wrap.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const within =
        Math.abs(e.clientX - cx) < rect.width / 2 + padding &&
        Math.abs(e.clientY - cy) < rect.height / 2 + padding;
      if (within) {
        setActive(true);
        inner.style.transition = activeTransition;
        inner.style.transform = `translate3d(${dx / strength}px, ${dy / strength}px, 0)`;
      } else {
        if (active) {
          inner.style.transition = inactiveTransition;
          inner.style.transform = 'translate3d(0, 0, 0)';
          setActive(false);
        }
      }
    };
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, [padding, strength, activeTransition, inactiveTransition, active]);

  return (
    <div ref={wrapperRef} className={className} style={style}>
      <div ref={innerRef} style={{ willChange: 'transform', transition: inactiveTransition }}>
        {children}
      </div>
    </div>
  );
}

/* ------------------------- AnimatedText -------------------------- */
function AnimatedText({ text, className = '', style = {} }) {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({
    target: ref,
    offset: ['start 0.8', 'end 0.2'],
  });
  const chars = useMemo(() => Array.from(text), [text]);

  return (
    <p ref={ref} className={className} style={style}>
      {chars.map((ch, i) => (
        <AnimatedChar key={i} char={ch} index={i} total={chars.length} progress={scrollYProgress} />
      ))}
    </p>
  );
}

function AnimatedChar({ char, index, total, progress }) {
  const start = index / total;
  const end = start + 1 / total;
  const opacity = useTransform(progress, [start, end], [0.2, 1]);
  return (
    <span style={{ position: 'relative', display: 'inline-block', whiteSpace: 'pre' }}>
      <span style={{ visibility: 'hidden' }}>{char}</span>
      <motion.span
        style={{
          position: 'absolute',
          left: 0,
          top: 0,
          opacity,
        }}
      >
        {char}
      </motion.span>
    </span>
  );
}

function MarqueeSection() {
  const sectionRef = useRef(null);
  const row1Ref = useRef(null);
  const row2Ref = useRef(null);

  const row1 = MARQUEE_URLS.slice(0, 11);
  const row2 = MARQUEE_URLS.slice(11);

  // triple for seamless loop
  const r1 = [...row1, ...row1, ...row1];
  const r2 = [...row2, ...row2, ...row2];

  useEffect(() => {
    const onScroll = () => {
      const section = sectionRef.current;
      if (!section) return;
      const rect = section.getBoundingClientRect();
      const sectionTop = window.scrollY + rect.top;
      const offset =
        (window.scrollY - sectionTop + window.innerHeight) * 0.3;
      if (row1Ref.current) {
        row1Ref.current.style.transform = `translateX(${offset - 200}px)`;
      }
      if (row2Ref.current) {
        row2Ref.current.style.transform = `translateX(${-(offset - 200)}px)`;
      }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <section
      ref={sectionRef}
      className="pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden"
      style={{ background: 'var(--bg)' }}
    >
      <div className="flex flex-col gap-3">

          style={{ willChange: 'transform' }}
        >
          {r1.map((u, i) => (

          ))}
        </div>
        <div
          ref={row2Ref}
          className="flex gap-3"
          style={{ willChange: 'transform' }}
        >
          {r2.map((u, i) => (
            <MarqueeTile key={`r2-${i}`} src={u} />
          ))}
        </div>
      </div>
    </section>
  );
}

function IframePreview({ src, title }) {
  const wrapperRef = useRef(null);
  const [scale, setScale] = useState(1);
  const [loaded, setLoaded] = useState(false);
  const NATIVE_W = 1440;
  const NATIVE_H = 810;

  useEffect(() => {
    if (!wrapperRef.current) return;
    const obs = new ResizeObserver((entries) => {
      for (const e of entries) {
        const w = e.contentRect.width;
        if (w > 0) setScale(w / NATIVE_W);
      }
    });
    obs.observe(wrapperRef.current);
    return () => obs.disconnect();
  }, []);

  return (
    <div
      ref={wrapperRef}
      className="w-full h-full relative overflow-hidden"
      style={{ background: '#0a0b0e' }}
    >
      <iframe
        src={src}
        title={title}
        loading="lazy"
        referrerPolicy="no-referrer"
        onLoad={() => setLoaded(true)}
        style={{
          width: NATIVE_W,
          height: NATIVE_H,
          border: 0,
          transform: `scale(${scale})`,
          transformOrigin: 'top left',
          pointerEvents: 'none',
          opacity: loaded ? 1 : 0,
          transition: 'opacity 0.5s ease',
        }}
      />
      {!loaded && (
        <div
          className="absolute inset-0 flex items-center justify-center"
          style={{
            background: 'repeating-linear-gradient(45deg,#1f2026 0 14px,#15161a 14px 28px)',
            color: 'var(--text)',
            opacity: 0.4,
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
            fontSize: 12,
            letterSpacing: '0.05em',
          }}
        >
          loading live preview…
        </div>
      )}
    </div>
  );
}

function ChatPreview({ script, agent }) {
  const containerRef = useRef(null);
  const [visibleCount, setVisibleCount] = useState(0);
  const [typingRole, setTypingRole] = useState(null);
  const [inView, setInView] = useState(false);

  const agentName = agent?.name || 'Agent';
  const agentRole = agent?.role || 'AI agent · online';
  const avatarLetter = agentName.charAt(0).toUpperCase();
  const avatarColor =
    agent?.avatarColor || 'linear-gradient(135deg, #c084fc 0%, #6366f1 100%)';
  const accent =
    agent?.accent || 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)';

  // Pause animation when card scrolls off-screen (cheap perf win)
  useEffect(() => {
    if (!containerRef.current || typeof IntersectionObserver === 'undefined') {
      setInView(true);
      return;
    }
    const obs = new IntersectionObserver(
      (entries) => entries.forEach((e) => setInView(e.isIntersecting)),
      { threshold: 0.15 }
    );
    obs.observe(containerRef.current);
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    if (!inView || !script || script.length === 0) return;
    let cancelled = false;

    const run = async () => {
      const wait = (ms) =>
        new Promise((res) => {
          const t = setTimeout(res, ms);
          if (cancelled) clearTimeout(t);
        });

      // small initial pause so it doesn't pop instantly when scrolled into view
      await wait(400);
      if (cancelled) return;

      while (!cancelled) {
        setVisibleCount(0);
        setTypingRole(null);
        await wait(500);
        if (cancelled) return;

        for (let i = 0; i < script.length; i++) {
          const msg = script[i];
          setTypingRole(msg.role);
          // user types fast, agent "thinks" a beat longer
          await wait(msg.role === 'user' ? 700 : 1100);
          if (cancelled) return;
          setTypingRole(null);
          setVisibleCount(i + 1);
          // pause between messages
          await wait(msg.role === 'agent' ? 1400 : 900);
          if (cancelled) return;
        }

        // hold final state, then loop
        await wait(2600);
        if (cancelled) return;
      }
    };

    run();
    return () => {
      cancelled = true;
    };
  }, [inView, script]);

  const visible = script.slice(0, visibleCount);
  const containerStyle = {
    background:
      'radial-gradient(ellipse at top, #1a1b21 0%, #0e0f12 60%, #0a0b0e 100%)',
    color: 'var(--text)',
  };

  return (
    <div
      ref={containerRef}
      className="w-full h-full flex flex-col"
      style={containerStyle}
    >
      {/* Header bar */}
      <div
        className="flex items-center gap-3 px-5 py-3.5 border-b"
        style={{ borderColor: 'rgba(215,226,234,0.08)' }}
      >
        <div
          className="rounded-full flex items-center justify-center font-medium"
          style={{
            width: 32,
            height: 32,
            background: avatarColor,
            color: '#fff',
            fontSize: 13,
            letterSpacing: '0.02em',
          }}
        >
          {avatarLetter}
        </div>
        <div className="flex flex-col leading-tight">
          <span
            className="font-medium"
            style={{ fontSize: 13, color: 'var(--text)' }}
          >
            {agentName}
          </span>
          <span
            className="font-light"
            style={{ fontSize: 11, color: 'var(--text)', opacity: 0.45 }}
          >
            {agentRole}
          </span>
        </div>
        <div className="ml-auto flex items-center gap-1.5">
          <span
            style={{
              width: 6,
              height: 6,
              borderRadius: '50%',
              background: '#4ade80',
              display: 'inline-block',
              boxShadow: '0 0 8px rgba(74,222,128,0.6)',
            }}
          />
        </div>
      </div>

      {/* Messages */}
      <div
        className="flex-1 overflow-hidden px-4 sm:px-6 py-4 sm:py-5 flex flex-col gap-2.5 sm:gap-3 justify-end"
      >
        {visible.map((msg, i) => (
          <ChatBubble key={i} role={msg.role} text={msg.text} accent={accent} />
        ))}
        {typingRole && <TypingBubble role={typingRole} accent={accent} />}
      </div>

      {/* Faux input bar */}
      <div
        className="px-4 sm:px-6 py-3 border-t flex items-center gap-3"
        style={{ borderColor: 'rgba(215,226,234,0.08)' }}
      >
        <div
          className="flex-1 rounded-full px-4 py-2"
          style={{
            background: 'rgba(215,226,234,0.05)',
            border: '1px solid rgba(215,226,234,0.08)',
            color: 'var(--text)',
            opacity: 0.4,
            fontSize: 12,
          }}
        >
          Message {agentName}…
        </div>
        <div
          className="rounded-full flex items-center justify-center"
          style={{
            width: 32,
            height: 32,
            background: 'rgba(215,226,234,0.08)',
            color: 'var(--text)',
            opacity: 0.5,
          }}
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path
              d="M3 11L21 3L13 21L11 13L3 11Z"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>
  );
}

function ChatBubble({ role, text, accent }) {
  const isUser = role === 'user';
  const userBg = accent || 'linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%)';
  return (
    <motion.div
      initial={{ opacity: 0, y: 10, scale: 0.96 }}
      animate={{ opacity: 1, y: 0, scale: 1 }}

  );
}

      '--font-body': "'Kanit', sans-serif",
    },
  },
  roseNoir: {
    label: 'Rose Noir',
    vars: {
      '--bg': '#0E0A0C',
      '--text': '#F3DDD8',
      '--border': '#F3DDD8',
      '--service-bg': '#FAF2EE',
      '--service-text': '#3C1F1F',
      '--service-border': 'rgba(60,31,31,0.18)',
      '--heading-from': '#A87170',
      '--heading-to': '#F2D5C9',
      '--font-display': "'Fraunces', serif",
      '--font-display-weight': '900',
      '--font-body': "'Fraunces', serif",
    },
  },
  softPastel: {
    label: 'Soft Pastel',
    vars: {
      '--bg': '#F7F1ED',
      '--text': '#3C2A2B',
      '--border': '#3C2A2B',
      '--service-bg': '#2A1A1E',
      '--service-text': '#F7F1ED',
      '--service-border': 'rgba(247,241,237,0.2)',
      '--heading-from': '#C28A82',
      '--heading-to': '#E5B7AB',
      '--font-display': "'Italiana', serif",
      '--font-display-weight': '400',
      '--font-body': "'Manrope', sans-serif",
    },
  },
  mauveMagenta: {
    label: 'Mauve Magenta',
    vars: {
      '--bg': '#0F0A14',
      '--text': '#F0D9E8',
      '--border': '#F0D9E8',
      '--service-bg': '#FFFFFF',
      '--service-text': '#0F0A14',
      '--service-border': 'rgba(15,10,20,0.18)',
      '--heading-from': '#9B6A8F',
      '--heading-to': '#FFC9E3',
      '--font-display': "'DM Serif Display', serif",
      '--font-display-weight': '400',
      '--font-body': "'Manrope', sans-serif",
    },
  },
};

function ThemeManager({ theme }) {
  useEffect(() => {
    const t = THEMES[theme] || THEMES.default;
    const root = document.documentElement;
    for (const [k, v] of Object.entries(t.vars)) {
      root.style.setProperty(k, v);
    }
  }, [theme]);
  return null;
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <div style={{ background: 'var(--bg)', overflowX: 'clip' }}>
      <ThemeManager theme={t.theme} />
      <HeroSection />
      <MarqueeSection />
      <AboutSection />
      <ServicesSection />
      <ProjectsSection />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Style" />
        <TweakSelect
          label="Theme"
          value={t.theme}
          options={[
            { value: 'default', label: 'Default (Jack)' },
            { value: 'roseNoir', label: 'Rose Noir' },
            { value: 'softPastel', label: 'Soft Pastel' },
            { value: 'mauveMagenta', label: 'Mauve Magenta' },
          ]}
          onChange={(v) => setTweak('theme', v)}
        />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);


</script>
</body>
</html>
